<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Agenda de Contatos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <!-- Barra de Pesquisa -->
  <ion-searchbar [(ngModel)]="termoBusca" (ionInput)="filtrarContatos()" placeholder="Pesquisar"></ion-searchbar>

  <!-- Lista de Contatos -->
  <ion-list>
    <ion-item *ngFor="let contato of contatosFiltrados">
      <ion-avatar slot="start">
        <ion-icon name="person-circle-outline" style="font-size: 40px; color: #3b4262;"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>{{ contato.nome }}</h2>
        <p>{{ contato.telefone }}</p>
        <p><small>Cat: {{ contato.categoria }}</small></p>
      </ion-label>

      <!-- Ações rápidas no item -->
      <ion-button fill="clear" (click)="ligar(contato)">
        <ion-icon name="call-outline" color="primary"></ion-icon>
      </ion-button>
      
      <ion-button fill="clear" (click)="alternarFavorito(contato)">
        <ion-icon [name]="contato.favorito ? 'star' : 'star-outline'" [color]="contato.favorito ? 'warning' : 'medium'"></ion-icon>
      </ion-button>

      <ion-button fill="clear" (click)="editarContato(contato)">
        <ion-icon name="create-outline" color="primary"></ion-icon>
      </ion-button>

      <ion-button fill="clear" color="danger" (click)="excluirContato(contato.id)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Botão Flutuante (FAB) para Novo Contato -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="abrirNovoContato()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- TELA NOVA / MODAL DE CADASTRO E EDIÇÃO -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="fecharModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-buttons slot="start">
            <ion-button (click)="fecharModal()">
              <ion-icon name="arrow-back"></ion-icon>
            </ion-button>
          </ion-buttons>
          <ion-title>{{ isEditMode ? 'Editar Contato' : 'Novo Contato' }}</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <ion-item>
          <ion-input label="Nome" labelPlacement="stacked" [(ngModel)]="nomeInput" placeholder="Digite o nome"></ion-input>
          <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
        </ion-item>

        <ion-item>
          <ion-input label="Telefone" labelPlacement="stacked" [(ngModel)]="telefoneInput" placeholder="(00) 00000-0000" type="tel"></ion-input>
          <ion-icon name="call-outline" slot="start" color="primary"></ion-icon>
        </ion-item>

        <ion-item>
          <ion-input label="E-mail" labelPlacement="stacked" [(ngModel)]="emailInput" placeholder="exemplo@email.com" type="email"></ion-input>
          <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
        </ion-item>

        <ion-item>
          <ion-select label="Categoria" labelPlacement="stacked" [(ngModel)]="categoriaInput">
            <ion-select-option value="Geral">Geral</ion-select-option>
            <ion-select-option value="Família">Família</ion-select-option>
            <ion-select-option value="Amigos">Amigos</ion-select-option>
            <ion-select-option value="Trabalho">Trabalho</ion-select-option>
          </ion-select>
          <ion-icon name="pricetag-outline" slot="start" color="primary"></ion-icon>
        </ion-item>

        <div class="ion-padding">
          <ion-button expand="block" (click)="salvarContato()" color="primary">
            <ion-icon name="save-outline" slot="start"></ion-icon>
            Salvar Contato
          </ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- Toast para mensagens -->
  <ion-toast [isOpen]="isToastOpen" [message]="mensagemToast" duration="2000" (didDismiss)="isToastOpen = false"></ion-toast>

</ion-content>
