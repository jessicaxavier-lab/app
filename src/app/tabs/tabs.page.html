<ion-tabs>
  <ion-tab-bar slot="bottom" style="background: #ffffff; border-top: 1px solid #edf0f7; height: 65px;">
    
    <ion-tab-button tab="tab1" style="--color: #888d9f; --color-selected: #3b4262;">
      <ion-icon name="book-outline" style="font-size: 26px; margin-bottom: 4px;"></ion-icon>
      <ion-label style="font-size: 12px; font-weight: 600;">Agenda</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" style="--color: #888d9f; --color-selected: #3b4262;">
      <ion-icon name="star-outline" style="font-size: 26px; margin-bottom: 4px;"></ion-icon>
      <ion-label style="font-size: 12px; font-weight: 600;">Favoritos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" style="--color: #888d9f; --color-selected: #3b4262;">
      <ion-icon name="information-circle-outline" style="font-size: 26px; margin-bottom: 4px;"></ion-icon>
      <ion-label style="font-size: 12px; font-weight: 600;">Sobre</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
